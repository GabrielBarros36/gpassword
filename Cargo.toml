[package]
name = "gpassword"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.11.1"
clap = { version = "4.5.47", features = ["derive"] }
dirs = "6.0.0"
jiff = { version = "0.2.15", features = ["serde"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
uuid = {version = "1.18.1", features = ["v4", "serde"]}

[dev-dependencies]
tempfile = "3.8"
